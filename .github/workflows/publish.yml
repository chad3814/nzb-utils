# The filename matters: every package's npm trusted publisher is bound to
# chad3814/nzb-utils/.github/workflows/publish.yml. Renaming this file breaks
# OIDC auth for all six until each publisher is reconfigured to match.
name: Stage publish

on:
  # Pushing a v* tag stages a publish. Deliberately the only automatic trigger:
  # a 'release: published' trigger would fire a second time for the same version
  # when a Release is cut from a tag that was already pushed, and the duplicate
  # `npm stage publish` would fail. Cut Releases for changelogs freely — they no
  # longer stage anything.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC). npm exchanges this token for a
  # short-lived credential, so no NPM_TOKEN secret is stored anywhere.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: stage a publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the tagged commit can be tested for containment in
          # main. A shallow clone cannot answer that question.
          fetch-depth: 0

      # `push: tags` cannot be narrowed to a branch: GitHub treats branches and
      # tags filters as alternatives rather than a conjunction, and a tag is not
      # branch-scoped in the first place. So assert it here instead — the tagged
      # commit must be reachable from main, or the tag sits on some other line
      # of history and must not be staged.
      #
      # HEAD is used rather than github.sha because HEAD is unambiguously the
      # tagged commit after checkout, whereas an annotated tag can leave
      # github.sha pointing at the tag object instead.
      - name: Ensure the tag is on main
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --quiet origin main
          sha="$(git rev-parse HEAD^{commit})"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "$REF_NAME ($sha) is contained in main"
          else
            echo "::error::$REF_NAME points at $sha, which is not contained in main; refusing to stage a publish"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # `npm stage publish` needs npm >= 11.15.0. Assert it rather than trust
      # whatever Node bundles, so a regression fails here with a clear message
      # instead of an obscure "unknown command" later.
      - name: Ensure npm supports staged publishing
        run: |
          npm install -g npm@latest
          installed="$(npm --version)"
          echo "npm $installed"
          node - "$installed" 11.15.0 <<'EOF'
          // argv[1] is '-' when the script is read from stdin, so real args start at 2.
          const [have, want] = process.argv.slice(2);
          const parts = (v) => v.split('.').map(Number);
          const [h, w] = [parts(have), parts(want)];
          for (let i = 0; i < 3; i += 1) {
            const a = h[i] ?? 0;
            const b = w[i] ?? 0;
            if (a > b) break;
            if (a < b) {
              console.error(`::error::npm ${have} is older than the required ${want} for 'npm stage publish'`);
              process.exit(1);
            }
          }
          EOF

      - run: npm ci

      # The same gate CI runs. A tag is not a licence to skip it: this is the
      # last point at which a bad release can be stopped for free.
      - run: npm run check

      # Every package ships `dist`, which is gitignored, so this is what puts
      # the shipped code on disk. It also has to happen before packing, because
      # each package's prepack refuses a missing or stale dist.
      - run: npm run build

      # A tag and package.json versions that disagree would stage releases
      # nobody can correlate back to a tag. Checked across all six, because
      # lockstep is only true if it is actually true. Read via env rather than
      # direct interpolation so the tag cannot be injected into the shell. A
      # manual dispatch has no tag to compare against, so it is checked out of
      # this gate.
      - name: Check every package version matches the tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "$EVENT_NAME run has no tag to verify; skipping"
            exit 0
          fi
          node --input-type=module -e '
            import { readdir, readFile } from "node:fs/promises";
            const tag = process.env.REF_NAME;
            const dirs = await readdir("packages");
            const wrong = [];
            for (const dir of dirs) {
              const pkg = JSON.parse(await readFile(`packages/${dir}/package.json`, "utf8"));
              if (`v${pkg.version}` !== tag) {
                wrong.push(`${pkg.name} is ${pkg.version}`);
              }
            }
            if (wrong.length > 0) {
              console.error(`::error::tag ${tag} does not match: ${wrong.join(", ")}`);
              process.exit(1);
            }
            console.log(`tag ${tag} matches all ${dirs.length} packages`);
          '

      - name: Show what will ship
        run: npm pack --workspaces --dry-run

      # The trusted publishers are configured to allow staging only, so this
      # uploads six tarballs to the stage queue rather than releasing them.
      # Nothing becomes installable until a maintainer approves each with a 2FA
      # challenge, which OIDC deliberately cannot do.
      #
      # --provenance is passed explicitly: the flag defaults to false, and while
      # trusted publishing enables provenance on its own, being explicit means
      # the attestation does not quietly depend on that default.
      - name: Stage the publishes
        run: npm stage publish --workspaces --provenance

      - name: Explain how to approve
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then label="$REF_NAME"; else label="(manual run)"; fi
          {
            echo '### Staged, awaiting approval'
            echo
            echo "All six packages at ${label} are in the stage queue."
            echo 'None is **installable** until approved with a 2FA challenge.'
            echo
            echo '```sh'
            echo 'npm stage list'
            echo 'npm stage download <stage-id>   # optional: inspect a tarball'
            echo 'npm stage approve <stage-id>    # prompts for 2FA'
            echo '```'
            echo
            echo 'Approve in dependency order — nzb-parser and yenc, then nntp'
            echo 'and par2, then nzb, then nzb-cli — so no published package'
            echo 'briefly references a version that does not exist yet.'
            echo
            echo 'Approval cannot be automated: it requires proof of presence,'
            echo 'which is the point.'
          } >> "$GITHUB_STEP_SUMMARY"
